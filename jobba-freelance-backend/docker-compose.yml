services:
  db:
    image: postgres:16-alpine
    container_name: jobba-freelance-db
    environment:
      POSTGRES_USER: jobba
      POSTGRES_PASSWORD: jobba
      POSTGRES_DB: jobba_freelance
    ports:
      - "5434:5432"
    volumes:
      - jobba_freelance_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobba -d jobba_freelance"]
      interval: 3s
      retries: 20
volumes:
  jobba_freelance_pg:
